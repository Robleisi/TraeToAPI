# 与 new-api 共用外部网络的部署方式。
# 独立部署请改用：docker compose -f docker-compose.standalone.yml up -d --build
services:
  traetoapi:
    build:
      context: .
      args:
        RELAY_BUILD_REVISION: "${RELAY_BUILD_REVISION:-local}"
    image: traetoapi:latest
    container_name: traetoapi
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    ports:
      - "${RELAY_PORT:-8000}:8000"
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      # CLI 模式可选：把宿主机 Linux 版 traecli 挂载进容器
      # - /usr/local/bin/traecli:/usr/local/bin/traecli:ro
      # - /root/.trae:/home/app/.trae:ro
    networks:
      - default
      - new-api

networks:
  new-api:
    external: true
    name: new-api_new-api-network
